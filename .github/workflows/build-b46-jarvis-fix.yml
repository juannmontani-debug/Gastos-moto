name: APK B46 JARVIS REPARADO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-b46-jarvis-fix.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build
          mkdir -p android-build/app/src/main/java/com/gastosviaje/app
          mkdir -p android-build/app/src/main/res/values
          mkdir -p android-build/app/src/main/assets/www

          cat > android-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GastosViaje"
          include ':app'
          EOF

          cat > android-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gastosviaje.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.gastosviaje.b46'
                  minSdk 26
                  targetSdk 35
                  versionCode 152
                  versionName 'B46'
              }
          }
          EOF

          cat > android-build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > android-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.CAMERA" />
          
              <application
                  android:allowBackup="true"
                  android:label="Gastos Viaje B46"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <service
                      android:name=".LocationTrackingService"
                      android:exported="false"
                      android:foregroundServiceType="location" />
                  <service
                      android:name=".VoiceAssistantService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          cat > android-build/app/src/main/java/com/gastosviaje/app/LocationTrackingService.java <<'EOF'
          package com.gastosviaje.app;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class LocationTrackingService extends Service implements LocationListener {
              public static final String ACTION_START = "com.gastosviaje.app.START_ROUTE";
              public static final String ACTION_STOP = "com.gastosviaje.app.STOP_ROUTE";
              public static final String EXTRA_DAY = "day";
              private static final String CHANNEL_ID = "route_tracking";
              private LocationManager locationManager;
              private String day = "hoy";

              @Override
              public void onCreate() {
                  super.onCreate();
                  locationManager = (LocationManager) getSystemService(LOCATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID, "Recorrido GPS", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(channel);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopTracking();
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  if (intent != null && intent.getStringExtra(EXTRA_DAY) != null) {
                      day = intent.getStringExtra(EXTRA_DAY);
                  }

                  Intent open = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(
                      this, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(this, CHANNEL_ID)
                      : new Notification.Builder(this);

                  Notification notification = builder
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentTitle("Gastos de Viaje")
                      .setContentText("Grabando recorrido GPS")
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build();

                  startForeground(1206, notification);
                  startTracking();
                  return START_STICKY;
              }

              private void startTracking() {
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                      checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      stopSelf();
                      return;
                  }
                  try {
                      locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 4000L, 5f, this);
                  } catch (Exception ignored) {}
                  try {
                      locationManager.requestLocationUpdates(LocationManager.NETWORK_PROVIDER, 7000L, 10f, this);
                  } catch (Exception ignored) {}
              }

              private void stopTracking() {
                  try { locationManager.removeUpdates(this); } catch (Exception ignored) {}
              }

              @Override
              public void onLocationChanged(Location location) {
                  try {
                      String key = "route_" + day;
                      String old = getSharedPreferences("native_routes", MODE_PRIVATE).getString(key, "[]");
                      JSONArray arr = new JSONArray(old);
                      JSONObject p = new JSONObject();
                      p.put("lat", location.getLatitude());
                      p.put("lon", location.getLongitude());
                      p.put("acc", location.getAccuracy());
                      p.put("ts", location.getTime());
                      arr.put(p);
                      getSharedPreferences("native_routes", MODE_PRIVATE)
                          .edit().putString(key, arr.toString()).apply();
                  } catch (Exception ignored) {}
              }

              @Override public void onStatusChanged(String provider, int status, Bundle extras) {}
              @Override public void onProviderEnabled(String provider) {}
              @Override public void onProviderDisabled(String provider) {}
              @Override public IBinder onBind(Intent intent) { return null; }
              @Override public void onDestroy() { stopTracking(); super.onDestroy(); }
          }
          EOF

          cat > android-build/app/src/main/java/com/gastosviaje/app/MainActivity.java <<'EOF'
          package com.gastosviaje.app;
          
          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.IntentFilter;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.speech.RecognizerIntent;
          import android.speech.tts.TextToSpeech;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import java.util.ArrayList;
          import java.util.Locale;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          
          public class MainActivity extends Activity {
              private static final int REQ_PERMS = 10;
              private static final int REQ_FILE = 11;
              private static final int REQ_SPEECH = 12;
          
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private TextToSpeech tts;
              private String speechMode = "manual";
              private final BroadcastReceiver assistantReceiver = new BroadcastReceiver() {
                  @Override public void onReceive(Context context, Intent intent) {
                      String text = intent.getStringExtra(VoiceAssistantService.EXTRA_TEXT);
                      if (text == null) return;
                      if (VoiceAssistantService.ACTION_STATUS.equals(intent.getAction())) {
                          js("window.onNativeAssistantStatus && window.onNativeAssistantStatus(" + JSONObject.quote(text) + ")");
                      } else {
                          js("window.onNativeAssistantCommand && window.onNativeAssistantCommand(" + JSONObject.quote(text) + ")");
                      }
                  }
              };
          
              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  requestPermissions(new String[]{
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.CAMERA,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.BLUETOOTH_CONNECT
                  }, REQ_PERMS);
          
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(Locale.forLanguageTag("es-419"));
                      }
                  });
          
                  webView = new WebView(this);
                  setContentView(webView);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setDatabaseEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient());
          
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
          
                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                          String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
          
                      @Override
                      public boolean onShowFileChooser(
                          WebView webView,
                          ValueCallback<Uri[]> filePathCallback,
                          FileChooserParams fileChooserParams) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = filePathCallback;
                          Intent i = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(i, REQ_FILE);
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                      }
                  });
          
                  webView.addJavascriptInterface(new NativeBridge(), "AndroidNative");
                  webView.loadUrl("file:///android_asset/www/index.html");
                  IntentFilter af = new IntentFilter(VoiceAssistantService.ACTION_COMMAND);
                  af.addAction(VoiceAssistantService.ACTION_STATUS);
                  if (android.os.Build.VERSION.SDK_INT >= 33) registerReceiver(assistantReceiver, af, Context.RECEIVER_NOT_EXPORTED);
                  else registerReceiver(assistantReceiver, af);
              }
          
              public class NativeBridge {
                  @JavascriptInterface
                  public void setAssistantActive(boolean active, String name, String reply, String voice, String route) {
                      Intent i = new Intent(MainActivity.this, VoiceAssistantService.class);
                      i.setAction(active ? VoiceAssistantService.ACTION_START : VoiceAssistantService.ACTION_STOP);
                      i.putExtra(VoiceAssistantService.EXTRA_NAME, name);
                      i.putExtra(VoiceAssistantService.EXTRA_REPLY, reply);
                      i.putExtra(VoiceAssistantService.EXTRA_VOICE, voice);
                      i.putExtra(VoiceAssistantService.EXTRA_ROUTE, route);
                      if (active && android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(i);
                      else startService(i);
                  }
                  @JavascriptInterface
                  public void saveTextFile(String fileName, String content) {
                      new Thread(() -> {
                          try {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) throw new Exception("No se pudo crear el archivo");
                              try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                                  if (out == null) throw new Exception("No se pudo abrir Descargas");
                                  out.write(content.getBytes(StandardCharsets.UTF_8));
                              }
                              js("window.onNativeBackupSaved && window.onNativeBackupSaved(true," + JSONObject.quote(fileName) + ")");
                          } catch (Exception e) {
                              js("window.onNativeBackupSaved && window.onNativeBackupSaved(false," + JSONObject.quote(e.getMessage()) + ")");
                          }
                      }).start();
                  }
          
                  @JavascriptInterface
                  public void speak(String text, String voiceName) {
                      runOnUiThread(() -> {
                          if (tts != null) {
                              if (voiceName != null && !voiceName.isEmpty() && tts.getVoices() != null) {
                                  for (android.speech.tts.Voice v : tts.getVoices()) {
                                      if (voiceName.equals(v.getName())) { tts.setVoice(v); break; }
                                  }
                              }
                              tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "assistant");
                          }
                      });
                  }
          
                  @JavascriptInterface
                  public String getVoices() {
                      JSONArray arr = new JSONArray();
                      try {
                          if (tts != null && tts.getVoices() != null) {
                              tts.getVoices().forEach(v -> {
                                  JSONObject o = new JSONObject();
                                  try {
                                      o.put("name", v.getName());
                                      o.put("lang", v.getLocale().toLanguageTag());
                                      arr.put(o);
                                  } catch (Exception ignored) {}
                              });
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }
          
                  @JavascriptInterface
                  public void startListening(String mode) {
                      speechMode = mode == null ? "manual" : mode;
                      runOnUiThread(() -> {
                          Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                          i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                          i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "es-419");
                          try {
                              startActivityForResult(i, REQ_SPEECH);
                          } catch (Exception e) {
                              js("window.onNativeSpeechError && window.onNativeSpeechError('No disponible','" + speechMode + "')");
                          }
                      });
                  }
          
                  @JavascriptInterface
                  public void startRoute(String day) {
                      Intent i = new Intent(MainActivity.this, LocationTrackingService.class);
                      i.setAction(LocationTrackingService.ACTION_START);
                      i.putExtra(LocationTrackingService.EXTRA_DAY, day == null ? "hoy" : day);
                      if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(i);
                      else startService(i);
                  }
          
                  @JavascriptInterface
                  public void stopRoute() {
                      Intent i = new Intent(MainActivity.this, LocationTrackingService.class);
                      i.setAction(LocationTrackingService.ACTION_STOP);
                      startService(i);
                  }
          
                  @JavascriptInterface
                  public String getRoute(String day) {
                      return getSharedPreferences("native_routes", MODE_PRIVATE)
                          .getString("route_" + day, "[]");
                  }
              }
          
              private void js(String code) {
                  runOnUiThread(() -> webView.evaluateJavascript(code, null));
              }
          
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
          
                  if (requestCode == REQ_FILE) {
                      if (fileCallback != null) {
                          Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                          fileCallback.onReceiveValue(result);
                          fileCallback = null;
                      }
                      return;
                  }
          
                  if (requestCode == REQ_SPEECH) {
                      String text = "";
                      if (resultCode == RESULT_OK && data != null) {
                          ArrayList<String> results = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                          if (results != null && !results.isEmpty()) text = results.get(0);
                      }
                      String safe = JSONObject.quote(text);
                      String mode = JSONObject.quote(speechMode);
                      js("window.onNativeSpeechResult && window.onNativeSpeechResult(" + safe + "," + mode + ")");
                  }
              }
          
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          
              @Override
              protected void onDestroy() {
                  try { unregisterReceiver(assistantReceiver); } catch (Exception ignored) {}
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

          cat > android-build/app/src/main/java/com/gastosviaje/app/VoiceAssistantService.java <<'EOF'
          package com.gastosviaje.app;
          
          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.bluetooth.BluetoothProfile;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.media.AudioDeviceInfo;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.provider.ContactsContract;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.view.KeyEvent;
          
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import java.text.Normalizer;
          import java.util.ArrayList;
          import java.util.Locale;
          
          public class VoiceAssistantService extends Service implements RecognitionListener {
              public static final String ACTION_START = "com.gastosviaje.app.ASSISTANT_START";
              public static final String ACTION_STOP = "com.gastosviaje.app.ASSISTANT_STOP";
              public static final String ACTION_COMMAND = "com.gastosviaje.app.ASSISTANT_COMMAND";
              public static final String ACTION_STATUS = "com.gastosviaje.app.ASSISTANT_STATUS";
              public static final String EXTRA_TEXT = "text";
              public static final String EXTRA_NAME = "name";
              public static final String EXTRA_REPLY = "reply";
              public static final String EXTRA_VOICE = "voice";
              public static final String EXTRA_ROUTE = "route";
              private static final String CHANNEL_ID = "voice_assistant";
              private static final int NOTIFICATION_ID = 451;
          
              private final Handler handler = new Handler(Looper.getMainLooper());
              private SpeechRecognizer recognizer;
              private Intent recognizerIntent;
              private TextToSpeech tts;
              private AudioManager audioManager;
              private boolean running;
              private boolean listening;
              private boolean speaking;
              private boolean awaitingCommand;
              private String wakeName = "jarvis";
              private String activationReply = "Sí, señor";
              private String preferredVoice = "";
              private String routeJson = "";
              private String pendingCallName = "";
              private String pendingCallNumber = "";
              private String lastHandledPhrase = "";
              private long lastHandledAt = 0L;
          
              @Override public void onCreate() {
                  super.onCreate();
                  audioManager = (AudioManager) getSystemService(AUDIO_SERVICE);
                  createChannel();
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(Locale.forLanguageTag("es-419"));
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              @Override public void onStart(String id) { speaking = true; }
                              @Override public void onDone(String id) { speaking = false; handler.postDelayed(thisService()::listen, 350); }
                              @Override public void onError(String id) { speaking = false; handler.postDelayed(thisService()::listen, 350); }
                          });
                      }
                  });
              }
          
              private VoiceAssistantService thisService() { return this; }
          
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopAssistant();
                      return START_NOT_STICKY;
                  }
                  if (intent != null) {
                      String v;
                      v = intent.getStringExtra(EXTRA_NAME); if (v != null && !v.trim().isEmpty()) wakeName = normalize(v);
                      v = intent.getStringExtra(EXTRA_REPLY); if (v != null && !v.trim().isEmpty()) activationReply = v.trim();
                      v = intent.getStringExtra(EXTRA_VOICE); if (v != null) preferredVoice = v;
                      v = intent.getStringExtra(EXTRA_ROUTE); if (v != null) routeJson = v;
                  }
                  running = true;
                  startForeground(NOTIFICATION_ID, notification("Escuchando “" + wakeName + "” por el intercomunicador"));
                  selectBluetoothMicrophone();
                  initRecognizer();
                  sendStatus("Micrófono activo. Decí “" + wakeName + "”.");
                  listen();
                  return START_STICKY;
              }
          
              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Asistente de viaje", NotificationManager.IMPORTANCE_LOW);
                      channel.setDescription("Mantiene activo el modo manos libres");
                      getSystemService(NotificationManager.class).createNotificationChannel(channel);
                  }
              }
          
              private Notification notification(String text) {
                  Intent open = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CHANNEL_ID) : new Notification.Builder(this);
                  return b.setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("Gastos Viaje B45 · Jarvis")
                      .setContentText(text).setContentIntent(pi).setOngoing(true).build();
              }
          
              private void selectBluetoothMicrophone() {
                  try {
                      if (Build.VERSION.SDK_INT >= 31 && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                          for (AudioDeviceInfo d : audioManager.getAvailableCommunicationDevices()) {
                              if (d.getType() == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) {
                                  audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                                  audioManager.setCommunicationDevice(d);
                                  return;
                              }
                          }
                      }
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                  } catch (Exception ignored) {}
              }
          
              private void initRecognizer() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      speak("El reconocimiento de voz no está disponible en este teléfono.");
                      return;
                  }
                  if (recognizer != null) recognizer.destroy();
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this);
                  recognizer.setRecognitionListener(this);
                  recognizerIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  recognizerIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  recognizerIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "es-419");
                  recognizerIntent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  recognizerIntent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);
              }
          
              private void listen() {
                  if (!running || speaking || listening || recognizer == null) return;
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return;
                  try {
                      listening = true;
                      recognizer.startListening(recognizerIntent);
                  } catch (Exception e) {
                      listening = false;
                      handler.postDelayed(this::listen, 900);
                  }
              }
          
              private void sendStatus(String status) {
                  sendBroadcast(new Intent(ACTION_STATUS).setPackage(getPackageName()).putExtra(EXTRA_TEXT, status));
              }
          
              private void handleHeard(String raw) {
                  String heard = normalize(raw);
                  if (heard.isEmpty()) return;
                  long now = android.os.SystemClock.elapsedRealtime();
                  if (heard.equals(lastHandledPhrase) && now - lastHandledAt < 3500L) return;
                  if (!pendingCallNumber.isEmpty()) {
                      if (heard.matches(".*\\b(si|confirmar|llamar|llama)\\b.*")) {
                          placeCall();
                      } else if (heard.matches(".*\\b(no|cancelar|cancela)\\b.*")) {
                          pendingCallName = ""; pendingCallNumber = "";
                          speak("Llamada cancelada.");
                      }
                      return;
                  }
                  String command = "";
                  int wakeAt = heard.indexOf(wakeName);
                  if (wakeAt >= 0) {
                      lastHandledPhrase = heard;
                      lastHandledAt = now;
                      command = heard.substring(wakeAt + wakeName.length()).trim();
                      if (command.isEmpty()) {
                          awaitingCommand = true;
                          speak(activationReply);
                          return;
                      }
                  } else if (awaitingCommand) {
                      command = heard;
                      awaitingCommand = false;
                  } else {
                      return;
                  }
                  execute(command);
              }
          
              private void execute(String command) {
                  if (command.contains("spotify") || command.matches(".*\\b(reproducir|musica|cancion|pausa|siguiente|anterior)\\b.*")) {
                      handleSpotify(command);
                      return;
                  }
                  if (command.startsWith("llamar ") || command.startsWith("llama ")) {
                      String name = command.replaceFirst("^llam(ar|a)\\s+(a\\s+)?", "").trim();
                      findContact(name);
                      return;
                  }
                  if (command.contains("ruta") || command.contains("hoja de ruta") || command.contains("terma") ||
                      command.contains("combustible cerca") || command.contains("historia") || command.contains("pueblo")) {
                      answerRoute(command);
                      return;
                  }
                  Intent i = new Intent(ACTION_COMMAND).setPackage(getPackageName()).putExtra(EXTRA_TEXT, command);
                  sendBroadcast(i);
              }
          
              private void handleSpotify(String command) {
                  if (command.contains("pausa")) { mediaKey(KeyEvent.KEYCODE_MEDIA_PAUSE); speak("Spotify en pausa."); return; }
                  if (command.contains("siguiente")) { mediaKey(KeyEvent.KEYCODE_MEDIA_NEXT); speak("Siguiente."); return; }
                  if (command.contains("anterior")) { mediaKey(KeyEvent.KEYCODE_MEDIA_PREVIOUS); speak("Anterior."); return; }
                  String query = command.replace("abrir spotify", "").replace("spotify", "")
                      .replaceFirst("^(reproducir|buscar|pone|poneme|musica|cancion)\\s*", "").trim();
                  Intent launch;
                  if (query.isEmpty()) launch = getPackageManager().getLaunchIntentForPackage("com.spotify.music");
                  else launch = new Intent(Intent.ACTION_VIEW, Uri.parse("spotify:search:" + Uri.encode(query)));
                  if (launch == null) launch = new Intent(Intent.ACTION_VIEW, Uri.parse("https://open.spotify.com/search/" + Uri.encode(query)));
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try { startActivity(launch); speak(query.isEmpty() ? "Abriendo Spotify." : "Buscando " + query + " en Spotify."); }
                  catch (Exception e) { speak("No pude abrir Spotify."); }
              }
          
              private void mediaKey(int code) {
                  long now = android.os.SystemClock.uptimeMillis();
                  audioManager.dispatchMediaKeyEvent(new KeyEvent(now, now, KeyEvent.ACTION_DOWN, code, 0));
                  audioManager.dispatchMediaKeyEvent(new KeyEvent(now, now, KeyEvent.ACTION_UP, code, 0));
              }
          
              private void findContact(String wanted) {
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) {
                      speak("Necesito permiso para leer tus contactos.");
                      return;
                  }
                  Cursor c = getContentResolver().query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER},
                      ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?",
                      new String[]{"%" + wanted + "%"}, null);
                  if (c != null) {
                      try {
                          if (c.moveToFirst()) {
                              pendingCallName = c.getString(0);
                              pendingCallNumber = c.getString(1);
                              speak("Encontré a " + pendingCallName + ". ¿Confirmás que lo llame?");
                              return;
                          }
                      } finally { c.close(); }
                  }
                  speak("No encontré a " + wanted + " en tus contactos.");
              }
          
              private void placeCall() {
                  if (checkSelfPermission(Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED) {
                      speak("Necesito permiso para realizar llamadas.");
                      return;
                  }
                  String name = pendingCallName;
                  Intent i = new Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(pendingCallNumber)));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  pendingCallName = ""; pendingCallNumber = "";
                  try { startActivity(i); speak("Llamando a " + name + "."); }
                  catch (Exception e) { speak("No pude iniciar la llamada."); }
              }
          
              private void answerRoute(String command) {
                  try {
                      if (routeJson == null || routeJson.trim().isEmpty() || routeJson.equals("null")) {
                          speak("Todavía no hay una hoja de ruta descargada.");
                          return;
                      }
                      JSONObject r = new JSONObject(routeJson);
                      String title = r.optString("title", r.optString("name", "tu hoja de ruta"));
                      JSONArray places = r.optJSONArray("places");
                      StringBuilder answer = new StringBuilder("Tenés descargada ").append(title).append(".");
                      if (places != null && places.length() > 0) {
                          answer.append(" Próximos lugares: ");
                          for (int n = 0; n < Math.min(3, places.length()); n++) {
                              if (n > 0) answer.append(", ");
                              Object p = places.opt(n);
                              answer.append(p instanceof JSONObject ? ((JSONObject)p).optString("name", p.toString()) : String.valueOf(p));
                          }
                          answer.append(".");
                      }
                      speak(answer.toString());
                  } catch (Exception e) {
                      speak("La hoja de ruta está descargada, pero no pude leer esa consulta.");
                  }
              }
          
              private void speak(String text) {
                  listening = false;
                  try { if (recognizer != null) recognizer.cancel(); } catch (Exception ignored) {}
                  if (tts == null) { handler.postDelayed(this::listen, 500); return; }
                  if (!preferredVoice.isEmpty() && tts.getVoices() != null) {
                      for (android.speech.tts.Voice v : tts.getVoices()) {
                          if (preferredVoice.equals(v.getName())) { tts.setVoice(v); break; }
                      }
                  }
                  speaking = true;
                  Bundle params = new Bundle();
                  tts.speak(text, TextToSpeech.QUEUE_FLUSH, params, "jarvis-service");
              }
          
              private static String normalize(String s) {
                  String n = Normalizer.normalize(s == null ? "" : s, Normalizer.Form.NFD)
                      .replaceAll("\\p{M}", "").toLowerCase(Locale.ROOT);
                  return n.replaceAll("[^a-z0-9ñ ]", " ").replaceAll("\\s+", " ").trim();
              }
          
              private void stopAssistant() {
                  running = false; listening = false;
                  try { if (recognizer != null) { recognizer.cancel(); recognizer.destroy(); recognizer = null; } } catch (Exception ignored) {}
                  try {
                      if (Build.VERSION.SDK_INT >= 31) audioManager.clearCommunicationDevice();
                      else { audioManager.stopBluetoothSco(); audioManager.setBluetoothScoOn(false); }
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                  } catch (Exception ignored) {}
                  stopForeground(true);
                  stopSelf();
              }
          
              @Override public void onReadyForSpeech(Bundle params) { sendStatus("Escuchando. Decí “" + wakeName + "”."); }
              @Override public void onBeginningOfSpeech() {}
              @Override public void onRmsChanged(float rmsdB) {}
              @Override public void onBufferReceived(byte[] buffer) {}
              @Override public void onEndOfSpeech() { listening = false; }
              @Override public void onError(int error) {
                  listening = false;
                  if (error != SpeechRecognizer.ERROR_NO_MATCH && error != SpeechRecognizer.ERROR_SPEECH_TIMEOUT) {
                      sendStatus("Reactivando micrófono…");
                  }
                  if (running && !speaking) handler.postDelayed(this::listen, error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY ? 1200 : 500);
              }
              @Override public void onResults(Bundle results) {
                  listening = false;
                  ArrayList<String> list = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                  if (list != null && !list.isEmpty()) handleHeard(list.get(0));
                  if (running && !speaking) handler.postDelayed(this::listen, 250);
              }
              @Override public void onPartialResults(Bundle partialResults) {
                  ArrayList<String> list = partialResults.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                  if (list == null || list.isEmpty()) return;
                  String heard = normalize(list.get(0));
                  int wakeAt = heard.indexOf(wakeName);
                  String afterWake = wakeAt >= 0 ? heard.substring(wakeAt + wakeName.length()).trim() : "";
                  if (wakeAt >= 0 && afterWake.isEmpty()) {
                      listening = false;
                      try { recognizer.cancel(); } catch (Exception ignored) {}
                      handleHeard(heard);
                  }
              }
              @Override public void onEvent(int eventType, Bundle params) {}
              @Override public IBinder onBind(Intent intent) { return null; }
              @Override public void onDestroy() {
                  running = false;
                  try { if (recognizer != null) recognizer.destroy(); } catch (Exception ignored) {}
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  super.onDestroy();
              }
          }
