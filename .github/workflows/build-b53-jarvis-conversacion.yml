          new_delete = "function deleteOfflineRoute(){const r=offlineRoutePackage();if(!r)return;if(!confirm('¿Eliminar esta ruta descargada del teléfono? Tus gastos y la Bitácora no se borran.'))return;localStorage.removeItem(OFFLINE_ROUTE_KEY);renderOfflineRoutes();syncOfflineRouteWithAssistant()}"
          old_command = 'window.onNativeAssistantCommand=function(text){const clean=String(text||"").trim();if(!clean)return;openSection("home");applyVoiceExpense(clean);jarvisPending=true;speakJarvis(voiceExpenseSummary(),()=>{});};'
          new_command = 'window.onNativeAssistantCommand=function(text){const clean=String(text||"").trim();if(!clean)return;const parsed=extractVoiceExpense(clean);if(!(parsed.amount>0)){jarvisPending=false;speakJarvis("No reconocí el importe. Para cargarlo decí, cargar gasto, categoría e importe.",()=>{});return}openSection("home");applyVoiceExpense(clean);jarvisPending=true;speakJarvis(voiceExpenseSummary(),()=>{});};'
