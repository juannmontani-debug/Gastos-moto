          new_import = "function syncOfflineRouteWithAssistant(){if(!handsFreeExpense||!window.AndroidNative?.setAssistantActive)return;try{AndroidNative.setAssistantActive(true,assistantName(),assistantReply(),selectedJarvisVoice()||'',JSON.stringify(offlineRoutePackage()||null));const st=document.getElementById('expenseVoiceStatus');if(st)st.textContent=`✅ Ruta conectada con ${assistantName()}. Decí ${assistantName()} para consultarla.`}catch(e){}}\nfunction importOfflineRoute(ev){const f=ev.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const r=JSON.parse(rd.result);if(!r||typeof r!=='object')throw 0;r.downloadedAt=new Date().toISOString();localStorage.setItem(OFFLINE_ROUTE_KEY,JSON.stringify(r));renderOfflineRoutes();syncOfflineRouteWithAssistant();alert('✅ Ruta guardada y conectada con el asistente para usar sin Internet.')}catch{alert('No pude leer ese archivo de ruta. Tiene que ser un paquete JSON válido.')}ev.target.value=''};rd.readAsText(f)}"
