              private void selectBluetoothMicrophone() {
                  try {
                      if (Build.VERSION.SDK_INT >= 31 && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                          for (AudioDeviceInfo d : audioManager.getAvailableCommunicationDevices()) {
                              if (d.getType() == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) {
                                  audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                                  audioManager.setCommunicationDevice(d);
                                  return;
                              }
                          }
                      }
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                  } catch (Exception ignored) {}
              }
          
              private void startContinuousListening() {
                  if (!running || speaking) return;
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      sendStatus("Falta permiso de micrófono.");
                      return;
                  }
                  if (speechService != null && listening) {
                      speechService.setPause(false);
                      sendStatus("✅ Escucha continua activa. Decí “" + wakeName + "”.");
                      return;
                  }
                  if (voskModel == null) {
                      loadVoskModel();
                      return;
                  }
                  try {
                      Recognizer recognizer = new Recognizer(voskModel, 16000.0f);
                      speechService = new SpeechService(recognizer, 16000.0f);
                      speechService.startListening(this);
                      listening = true;
                      sendStatus("✅ Escucha continua activa. Decí “" + wakeName + "”.");
                  } catch (Exception e) {
                      listening = false;
                      speechService = null;
                      sendStatus("No pude iniciar el micrófono continuo.");
                      handler.postDelayed(this::startContinuousListening, 1800);
                  }
              }
          
              private void resumeContinuousListening() {
                  if (!running) return;
                  if (speechService != null) {
                      speechService.setPause(false);
                      listening = true;
                      sendStatus("✅ Escucha continua activa. Decí “" + wakeName + "”.");
                  } else {
                      startContinuousListening();
                  }
              }
          
              private void loadVoskModel() {
                  if (modelLoading || voskModel != null) return;
                  modelLoading = true;
                  sendStatus("Preparando reconocimiento español…");
                  modelExecutor.execute(() -> {
                      try {
                          File modelDir = new File(getFilesDir(), "vosk-model-es-0.42");
                          File marker = new File(modelDir, "am/final.mdl");
                          if (!marker.exists()) copyAssetTree(getAssets(), "model-es", modelDir);
                          Model loaded = new Model(modelDir.getAbsolutePath());
                          handler.post(() -> {
                              modelLoading = false;
                              voskModel = loaded;
                              startContinuousListening();
                          });
                      } catch (Exception e) {
                          handler.post(() -> {
                              modelLoading = false;
                              sendStatus("Error preparando la escucha sin conexión.");
                          });
                      }
                  });
              }
          
              private void copyAssetTree(AssetManager assets, String assetPath, File target) throws Exception {
                  String[] children = assets.list(assetPath);
                  if (children != null && children.length > 0) {
                      if (!target.exists() && !target.mkdirs()) throw new Exception("No se pudo crear " + target);
                      for (String child : children) copyAssetTree(assets, assetPath + "/" + child, new File(target, child));
                      return;
                  }
                  File parent = target.getParentFile();
                  if (parent != null && !parent.exists() && !parent.mkdirs()) throw new Exception("No se pudo crear " + parent);
                  try (InputStream in = assets.open(assetPath); FileOutputStream out = new FileOutputStream(target)) {
                      byte[] buffer = new byte[16384];
                      int count;
                      while ((count = in.read(buffer)) != -1) out.write(buffer, 0, count);
                  }
              }
          
              private void sendStatus(String status) {
                  sendBroadcast(new Intent(ACTION_STATUS).setPackage(getPackageName()).putExtra(EXTRA_TEXT, status));
              }
          
              private void handleHeard(String raw) {
                  String heard = normalize(raw);
                  if (heard.isEmpty()) return;
                  long now = android.os.SystemClock.elapsedRealtime();
                  if (heard.equals(lastHandledPhrase) && now - lastHandledAt < 3500L) return;
                  if (!pendingCallNumber.isEmpty()) {
                      if (heard.matches(".*\\b(si|confirmar|llamar|llama)\\b.*")) {
                          placeCall();
                      } else if (heard.matches(".*\\b(no|cancelar|cancela)\\b.*")) {
                          pendingCallName = ""; pendingCallNumber = "";
                          speak("Llamada cancelada.");
                      }
                      return;
                  }
                  String command = "";
                  int wakeAt = heard.indexOf(wakeName);
                  if (wakeAt >= 0) {
                      lastHandledPhrase = heard;
                      lastHandledAt = now;
                      conversationUntil = now + 45000L;
                      command = heard.substring(wakeAt + wakeName.length()).trim();
                      if (command.isEmpty()) {
                          awaitingCommand = true;
                          speak(activationReply);
                          return;
                      }
                  } else if (awaitingCommand) {
                      command = heard;
                      awaitingCommand = false;
                      conversationUntil = now + 45000L;
                  } else if (now < conversationUntil) {
                      // Durante 45 segundos acepta repreguntas sin exigir repetir "Jarvis".
                      command = heard;
                  } else {
                      return;
                  }
                  execute(command);
              }
          
              private void execute(String command) {
                  if (command.contains("spotify") || command.matches(".*\\b(reproducir|musica|cancion|pausa|siguiente|anterior)\\b.*")) {
                      handleSpotify(command);
                      return;
                  }
                  if (command.startsWith("llamar ") || command.startsWith("llama ")) {
                      String name = command.replaceFirst("^llam(ar|a)\\s+(a\\s+)?", "").trim();
                      findContact(name);
                      return;
                  }
                  // Una categoría sola o una pregunta pertenece a la hoja de ruta.
                  // Sólo se abre Gastos si hay una intención explícita o un importe.
                  boolean routeTopic = command.matches(".*\\b(ruta|mapa|recorrido|etapa|destino|pueblo|historia|terma|termas|alojamiento|alojamientos|hotel|hoteles|hostel|hospedaje|combustible|nafta|gasolina|estacion|estaciones)\\b.*");
                  boolean explicitExpense = command.matches(".*\\b(gasto|gaste|pague|pagar|cargar|carga|anotar|anota|registrar|registra|compre|guardar gasto)\\b.*");
                  boolean amountPresent = command.matches(".*(?:\\d|\\b(?:mil|millon|millones|cien|ciento|doscientos|trescientos|cuatrocientos|quinientos|seiscientos|setecientos|ochocientos|novecientos|veinte|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa)\\b).*");
                  boolean routeQuestion = command.matches(".*\\b(que|cual|cuales|donde|hay|queda|quedan|proximo|proxima|proximos|proximas|informacion|decime|dime|buscar|mostrame|mostrar|consultar|consulta)\\b.*");
                  boolean followUp = command.matches(".*\\b(y|antes|despues|cerca|lejos|conviene|mejor|otro|otra|alguno|alguna|cuanto|cuantos)\\b.*");
                  if (!routeTopic && followUp && android.os.SystemClock.elapsedRealtime() < conversationUntil) {
                      command = command + " " + lastRouteTopic;
                      routeTopic = true;
                      routeQuestion = true;
                  }
                  if (routeTopic && !explicitExpense && (routeQuestion || !amountPresent)) {
                      conversationUntil = android.os.SystemClock.elapsedRealtime() + 45000L;
                      answerRoute(command);
                      return;
                  }
                  if (!explicitExpense && !amountPresent) {
                      speak("No entendí si querés consultar la ruta o cargar un gasto. Para un gasto decí, cargar gasto, categoría e importe.");
                      return;
                  }
                  conversationUntil = 0L;
                  Intent i = new Intent(ACTION_COMMAND).setPackage(getPackageName()).putExtra(EXTRA_TEXT, command);
                  sendBroadcast(i);
              }
          
              private void handleSpotify(String command) {
                  if (command.contains("pausa")) { mediaKey(KeyEvent.KEYCODE_MEDIA_PAUSE); speak("Spotify en pausa."); return; }
                  if (command.contains("siguiente")) { mediaKey(KeyEvent.KEYCODE_MEDIA_NEXT); speak("Siguiente."); return; }
                  if (command.contains("anterior")) { mediaKey(KeyEvent.KEYCODE_MEDIA_PREVIOUS); speak("Anterior."); return; }
                  String query = command.replace("abrir spotify", "").replace("spotify", "")
                      .replaceFirst("^(reproducir|buscar|pone|poneme|musica|cancion)\\s*", "").trim();
                  Intent launch;
                  if (query.isEmpty()) launch = getPackageManager().getLaunchIntentForPackage("com.spotify.music");
                  else launch = new Intent(Intent.ACTION_VIEW, Uri.parse("spotify:search:" + Uri.encode(query)));
                  if (launch == null) launch = new Intent(Intent.ACTION_VIEW, Uri.parse("https://open.spotify.com/search/" + Uri.encode(query)));
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try { startActivity(launch); speak(query.isEmpty() ? "Abriendo Spotify." : "Buscando " + query + " en Spotify."); }
                  catch (Exception e) { speak("No pude abrir Spotify."); }
              }
          
              private void mediaKey(int code) {
                  long now = android.os.SystemClock.uptimeMillis();
                  audioManager.dispatchMediaKeyEvent(new KeyEvent(now, now, KeyEvent.ACTION_DOWN, code, 0));
                  audioManager.dispatchMediaKeyEvent(new KeyEvent(now, now, KeyEvent.ACTION_UP, code, 0));
              }
          
              private void findContact(String wanted) {
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) {
                      speak("Necesito permiso para leer tus contactos.");
                      return;
                  }
                  Cursor c = getContentResolver().query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER},
                      ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?",
                      new String[]{"%" + wanted + "%"}, null);
                  if (c != null) {
                      try {
                          if (c.moveToFirst()) {
                              pendingCallName = c.getString(0);
                              pendingCallNumber = c.getString(1);
                              speak("Encontré a " + pendingCallName + ". ¿Confirmás que lo llame?");
                              return;
                          }
                      } finally { c.close(); }
                  }
                  speak("No encontré a " + wanted + " en tus contactos.");
              }
          
              private void placeCall() {
                  if (checkSelfPermission(Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED) {
                      speak("Necesito permiso para realizar llamadas.");
                      return;
                  }
                  String name = pendingCallName;
                  Intent i = new Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(pendingCallNumber)));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  pendingCallName = ""; pendingCallNumber = "";
                  try { startActivity(i); speak("Llamando a " + name + "."); }
                  catch (Exception e) { speak("No pude iniciar la llamada."); }
              }
          
              private void answerRoute(String command) {
                  try {
                      if (routeJson == null || routeJson.trim().isEmpty() || routeJson.equals("null")) {
                          speak("Todavía no hay una hoja de ruta descargada.");
                          return;
                      }
                      JSONObject r = new JSONObject(routeJson);
                      String[] keys;
                      String heading;
                      if (command.matches(".*\\b(alojamiento|alojamientos|hotel|hoteles|hostel|hospedaje)\\b.*")) {
                          keys = new String[]{"alojamiento","alojamientos","lodging","hotel","hoteles","hostel","hospedaje"}; heading = "En la ruta encontré estos alojamientos: "; lastRouteTopic = "alojamientos";
                      } else if (command.matches(".*\\b(combustible|nafta|gasolina|estacion|estaciones)\\b.*")) {
                          keys = new String[]{"combustible","fuel","nafta","gasolina","estacion","estaciones","service"}; heading = "Sobre el combustible de la ruta, encontré: "; lastRouteTopic = "combustible";
                      } else if (command.contains("terma")) {
                          keys = new String[]{"terma","termas","thermas","thermal"}; heading = "Estas son las termas que figuran en la ruta: "; lastRouteTopic = "termas";
                      } else if (command.contains("historia")) {
                          keys = new String[]{"historia","history","historico","historica"}; heading = "Te resumo la información histórica: "; lastRouteTopic = "historia";
                      } else {
                          keys = new String[]{"places","lugares","pueblos","etapas","stages","segments","tramos","route","ruta","notes","notas"}; heading = "Sobre tu recorrido, encontré: "; lastRouteTopic = "ruta";
                      }
                      java.util.ArrayList<String> found = new java.util.ArrayList<>();
                      collectRouteInfo(r, keys, found, 0);
                      String title = r.optString("title", r.optString("name", "tu hoja de ruta"));
                      if (found.isEmpty()) {
                          speak("Tenés descargada " + title + ", pero ese dato no figura en el archivo de la ruta.");
                          return;
                      }
                      String joined = android.text.TextUtils.join(". ", found);
                      if (joined.length() > 520) joined = joined.substring(0, 520) + ". El resto está disponible en la pantalla de ruta";
                      speak(heading + joined + ". Podés hacerme otra pregunta sin repetir Jarvis.");
                  } catch (Exception e) {
                      speak("La hoja de ruta está descargada, pero no pude leer esa consulta.");
                  }
              }

              private void collectRouteInfo(Object node, String[] keys, java.util.ArrayList<String> out, int depth) throws Exception {
                  if (node == null || node == JSONObject.NULL || depth > 8 || out.size() >= 8) return;
                  if (node instanceof JSONObject) {
                      JSONObject obj = (JSONObject) node;
                      java.util.Iterator<String> it = obj.keys();
                      while (it.hasNext() && out.size() < 8) {
                          String key = it.next(); Object value = obj.opt(key); String nk = normalize(key);
                          boolean match = false;
                          for (String wanted : keys) if (nk.contains(normalize(wanted))) { match = true; break; }
                          if (match) addRouteValue(value, out, depth + 1);
                          else if (value instanceof JSONObject || value instanceof JSONArray) collectRouteInfo(value, keys, out, depth + 1);
                      }
                  } else if (node instanceof JSONArray) {
                      JSONArray arr = (JSONArray) node;
                      for (int i = 0; i < arr.length() && out.size() < 8; i++) collectRouteInfo(arr.opt(i), keys, out, depth + 1);
                  }
              }

              private void addRouteValue(Object value, java.util.ArrayList<String> out, int depth) throws Exception {
                  if (value == null || value == JSONObject.NULL || out.size() >= 8) return;
                  if (value instanceof JSONObject || value instanceof JSONArray) {
                      java.util.ArrayList<String> leaves = new java.util.ArrayList<>();
                      collectAllRouteLeaves(value, leaves, depth);
                      if (!leaves.isEmpty()) out.add(android.text.TextUtils.join(", ", leaves));
                  } else {
                      String text = cleanRouteValue(value);
                      if (!text.isEmpty() && !out.contains(text)) out.add(text);
                  }
              }

              private void collectAllRouteLeaves(Object node, java.util.ArrayList<String> out, int depth) throws Exception {
                  if (node == null || node == JSONObject.NULL || depth > 10 || out.size() >= 12) return;
                  if (node instanceof JSONObject) {
                      JSONObject obj = (JSONObject) node; java.util.Iterator<String> it = obj.keys();
                      while (it.hasNext() && out.size() < 12) {
                          String key = it.next();
                          if (!isTechnicalRouteKey(key)) collectAllRouteLeaves(obj.opt(key), out, depth + 1);
                      }
                  } else if (node instanceof JSONArray) {
                      JSONArray arr = (JSONArray) node;
                      for (int i = 0; i < arr.length() && out.size() < 12; i++) collectAllRouteLeaves(arr.opt(i), out, depth + 1);
                  } else {
                      String text = cleanRouteValue(node);
                      if (!text.isEmpty() && !out.contains(text)) out.add(text);
                  }
              }

              private boolean isTechnicalRouteKey(String key) {
                  String k = normalize(key);
                  return k.matches(".*\\b(id|lat|latitude|lon|lng|longitude|timestamp|downloadedat|version|index|codigo|code|url|link|geometry|coordinates|coordenadas)\\b.*");
              }

              private String cleanRouteValue(Object value) {
                  String text = String.valueOf(value == null ? "" : value).trim();
                  if (text.isEmpty() || text.equalsIgnoreCase("true") || text.equalsIgnoreCase("false") || text.equalsIgnoreCase("null")) return "";
                  if (text.matches("[-+]?\\d+(?:[.,]\\d+)?") || text.matches("[-+]?\\d+(?:[.,]\\d+)?\\s*[,;/]\\s*[-+]?\\d+(?:[.,]\\d+)?")) return "";
                  if (text.matches("(?i).*(https?://|www\\.|\\.json\\b|\\.gpx\\b).*") ) return "";
                  text = text.replaceAll("[{}_\\[\\]\\\"]", " ").replaceAll("\\s+", " ").trim();
                  if (text.length() < 3) return "";
                  return text;
              }
          
              private void speak(String text) {
                  if (speechService != null) speechService.setPause(true);
                  if (tts == null) { handler.postDelayed(() -> resumeContinuousListening(), 500); return; }
                  if (!preferredVoice.isEmpty() && tts.getVoices() != null) {
                      for (android.speech.tts.Voice v : tts.getVoices()) {
                          if (preferredVoice.equals(v.getName())) { tts.setVoice(v); break; }
                      }
                  }
                  speaking = true;
                  Bundle params = new Bundle();
                  tts.speak(text, TextToSpeech.QUEUE_FLUSH, params, "jarvis-service");
              }
          
              private static String normalize(String s) {
                  String n = Normalizer.normalize(s == null ? "" : s, Normalizer.Form.NFD)
                      .replaceAll("\\p{M}", "").toLowerCase(Locale.ROOT);
                  return n.replaceAll("[^a-z0-9ñ ]", " ").replaceAll("\\s+", " ").trim();
              }
          
              private void stopAssistant() {
                  running = false; listening = false;
                  stopSpeechService();
                  try {
                      if (Build.VERSION.SDK_INT >= 31) audioManager.clearCommunicationDevice();
                      else { audioManager.stopBluetoothSco(); audioManager.setBluetoothScoOn(false); }
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                  } catch (Exception ignored) {}
                  stopForeground(true);
                  stopSelf();
              }
          
              private void stopSpeechService() {
                  SpeechService current = speechService;
                  speechService = null;
                  if (current != null) {
                      try { current.cancel(); } catch (Exception ignored) {}
                      try { current.shutdown(); } catch (Exception ignored) {}
                  }
              }
          
              private String voskText(String hypothesis, String key) {
                  try { return new JSONObject(hypothesis == null ? "{}" : hypothesis).optString(key, "").trim(); }
                  catch (Exception ignored) { return ""; }
              }
          
              @Override public void onResult(String hypothesis) {
                  String text = voskText(hypothesis, "text");
                  if (!text.isEmpty() && !speaking) handleHeard(text);
              }
          
              @Override public void onFinalResult(String hypothesis) {
                  listening = false;
                  String text = voskText(hypothesis, "text");
                  if (!text.isEmpty() && !speaking) handleHeard(text);
                  stopSpeechService();
                  if (running) handler.postDelayed(this::startContinuousListening, 1000);
              }
          
              @Override public void onPartialResult(String hypothesis) {
                  if (speaking) return;
                  String heard = normalize(voskText(hypothesis, "partial"));
                  int wakeAt = heard.indexOf(wakeName);
                  String afterWake = wakeAt >= 0 ? heard.substring(wakeAt + wakeName.length()).trim() : "";
                  if (wakeAt >= 0 && afterWake.isEmpty()) {
                      handleHeard(heard);
                  }
              }
          
              @Override public void onError(Exception error) {
                  listening = false;
                  stopSpeechService();
                  sendStatus("Reactivando escucha continua…");
                  if (running) handler.postDelayed(this::startContinuousListening, 1800);
              }
          
              @Override public void onTimeout() {
                  listening = false;
                  stopSpeechService();
                  if (running) handler.postDelayed(this::startContinuousListening, 1000);
              }
          
              @Override public IBinder onBind(Intent intent) { return null; }
              @Override public void onDestroy() {
                  running = false;
                  stopSpeechService();
                  try { if (voskModel != null) voskModel.close(); } catch (Exception ignored) {}
                  modelExecutor.shutdownNow();
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  super.onDestroy();
              }
          }
